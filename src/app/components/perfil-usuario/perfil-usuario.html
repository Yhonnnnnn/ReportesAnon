@if (auth.usuarioActual(); as usuario) {
  <div class="perfil">
    <button class="perfil-btn" type="button" (click)="toggleMenu(); $event.stopPropagation()">
      <span class="perfil-avatar" [style.background]="usuario.avatarColor">
        {{ inicial(usuario.alias) }}
      </span>
      <span class="perfil-alias">{{ usuario.alias }}</span>
      <svg class="perfil-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    @if (menuAbierto) {
      <div class="perfil-menu" (click)="$event.stopPropagation()">
        <div class="perfil-menu-header">
          <span class="perfil-avatar grande" [style.background]="usuario.avatarColor">
            {{ inicial(usuario.alias) }}
          </span>
          <div>
            <p class="perfil-menu-alias">{{ usuario.alias }}</p>
            <p class="perfil-menu-hint">Cuenta anónima</p>
          </div>
        </div>
        <button class="perfil-menu-item" type="button" (click)="cerrarSesion()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Cerrar sesión
        </button>
      </div>
    }
  </div>
} @else {
  <a routerLink="/login" class="perfil-login-btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
      <polyline points="10 17 15 12 10 7"></polyline>
      <line x1="15" y1="12" x2="3" y2="12"></line>
    </svg>
    Iniciar sesión
  </a>
}
